<meta charset="utf-8">

{% include seo.html %}

<!-- ⚠️ [JANGAN HAPUS/UBAH] PRELOAD LCP — mengurangi LCP time.
       Menghapus ini akan menaikkan LCP > 4 dtk dan menurunkan skor Performa. -->
<!-- ⚠️ JANGAN UBAH: preload LCP image -->
<link rel="preload" as="image" href="/assets/images/bio-photo.png" fetchpriority="high">

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ '/feed.xml' | relative_url }}{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- https://t.co/dKP3o1e -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Hreflang: sinyal bahasa ke Google (smart per-page) -->
{% if page.lang == 'en' %}
<link rel="alternate" hreflang="en" href="{{ site.url }}{{ page.url }}">
{% if page.lang_id %}<link rel="alternate" hreflang="id" href="{{ site.url }}{{ page.lang_id }}">
<link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ page.lang_id }}">{% else %}
<link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ page.url }}">{% endif %}
{% elsif page.lang_en %}
<link rel="alternate" hreflang="id" href="{{ site.url }}{{ page.url }}">
<link rel="alternate" hreflang="en" href="{{ site.url }}{{ page.lang_en }}">
<link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ page.url }}">
{% else %}
<link rel="alternate" hreflang="id" href="{{ site.url }}{{ page.url }}">
<link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ page.url }}">
{% endif %}

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- Preconnect CDN -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="dns-prefetch" href="//translate.google.com">
<link rel="dns-prefetch" href="//translate.googleapis.com">

<!-- Critical CSS inline: dark bg + layout -->

.page__footer-follow ul{margin:.25em 0!important;padding:0!important}.page__footer-copyright{margin-top:.25em!important;font-size:.75em!important}.masthead{min-height:56px}.author__avatar{width:80px!important;height:80px!important;min-width:80px!important;flex-shrink:0}.author__avatar img{width:80px!important;height:80px!important;max-width:80px!important;border-radius:50%;object-fit:cover;display:block}.greedy-nav .visible-links{overflow:hidden;min-height:2em}.goog-te-banner-frame{display:none!important}.skiptranslate iframe{display:none!important}body{top:0!important}#google_translate_element{display:none!important}.goog-te-gadget{display:none!important}#lang-switcher{position:fixed;bottom:20px;right:20px;z-index:9999;background:#252a34;border:1px solid #51555d;border-radius:8px;padding:6px 12px;cursor:pointer;color:#eaeaea;font-size:13px;display:flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.4)}#lang-switcher:hover{background:#2d3347}#lang-notice{position:fixed;bottom:0;left:0;right:0;background:#0a84ff;color:#fff;padding:10px 20px;z-index:10000;display:flex;align-items:center;justify-content:space-between;font-size:14px;gap:10px}#lang-notice a{color:#fff;font-weight:bold}#lang-notice button{background:none;border:none;color:#fff;cursor:pointer;font-size:18px;padding:0 4px}</style>
